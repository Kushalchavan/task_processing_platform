services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # .sql files here run automatically the FIRST time the DB is created
      - ./migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata: