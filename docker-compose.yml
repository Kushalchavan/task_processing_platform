services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: taskdb
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # .sql files here run automatically the FIRST time the DB is created
      - ./migrations:/docker-entrypoint-initdb.d
  redis:
    image: redis:7
    ports: ["6380:6379"]

volumes:
  pgdata: